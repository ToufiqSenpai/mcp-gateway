packages:
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  workerd: true

# The vitest pool bundles an older Miniflare whose workerd predates compatibility_date
# 2026-11-01. One workerd for the whole workspace keeps tests on the deploy runtime.
overrides:
  workerd: 1.20261103.1
  # One kiota preview number per install: mixing them breaks `registerDefaultDeserializer`
  # at bundle time. msgraph-sdk-core still asks for authentication-azure ^preview.82.
  '@microsoft/kiota-abstractions': 1.0.0-preview.112
  '@microsoft/kiota-authentication-azure': 1.0.0-preview.112
